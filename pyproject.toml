[project]
name = "bytemancer"
version = "0.1.0"
description = "Single-source generator for the Bytemancer theme"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.14.3",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = [
  "I",        # import sorting
  "UP",       # pyupgrade
  "B",        # bugbear
  "D",        # docstrings (google convention)
  "C901",     # mccabe complexity
  "PLR0912",  # too many branches
  "PLR0915",  # too many statements
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-branches = 12
max-statements = 50

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "ty>=0.0.104",
]
