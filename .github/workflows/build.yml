name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check   # tsc — tsx doesn't type-check
      - run: npm test
      # Regenerate and fail if the committed output no longer matches its inputs.
      - run: npm run build
      - name: Fail on stale generated output
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
