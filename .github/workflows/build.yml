name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Fail instead of silently re-resolving when uv.lock is out of date
      UV_LOCKED: "1"
    steps:
      - uses: actions/checkout@v4
      # Installs the python and uv versions pinned in mise.toml
      - uses: jdx/mise-action@v5
      # lint, typecheck, test, then regenerate ports/ and fail if it is stale
      - run: mise run ci
